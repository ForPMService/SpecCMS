name: speccms

services:
  php:
     build:
       context: ./php
       dockerfile: Dockerfile
     working_dir: /workspace/backend
     volumes:
      - type: bind
        source: ..
        target: /workspace
     ports:
      - "8000:8000"
     command:
      - php
      - artisan
      - serve
      - --host=0.0.0.0
      - --port=8000

  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-speccms}
      POSTGRES_USER: ${POSTGRES_USER:-speccms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-speccms_dev}
    volumes:
      - speccms_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  node:
    image: node:24.21.0-bookworm-slim
    working_dir: /workspace
    volumes:
      - type: bind
        source: ..
        target: /workspace
    command: ["sleep", "infinity"]

  silex:
    image: silexlabs/silex-platform:3.9.0
    ports:
      - "6805:6805"
    environment:
      SILEX_SESSION_SECRET: ${SILEX_SESSION_SECRET:-speccms-local-silex-session-secret-1234567890}
      SILEX_URL: http://localhost:6805
      STORAGE_CONNECTORS: fs
      HOSTING_CONNECTORS: fs,download
      SILEX_FS_ROOT: /data/storage
      SILEX_FS_HOSTING_ROOT: /data/hosting
    volumes:
      - speccms_silex_data:/data

  nginx:
    image: nginx:1.30.5-alpine3.24
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../storage/live:/usr/share/nginx/html:ro

volumes:
  speccms_pgdata:
  speccms_silex_data:
